{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020604"><title>{{title}} | Emerald Rozalia</title><link rel="stylesheet" href="{% static 'css/portal_visual.css' %}"></head><body><a class="back" href="{% url 'home' %}">← Home</a><nav class="portal-nav"><a href="{% url 'franchise_portal' %}">Franchise</a><a href="{% url 'corporate_portal' %}">Corporate</a><a href="{% url 'investor_portal' %}">Investor</a><a href="{% url 'factory_public_portal' %}">Factory</a><a href="{% url 'try_on_portal' %}">Try-On</a><a href="{% url 'returns_portal' %}">Returns</a><a href="{% url 'wishlist_portal' %}">Wishlist</a></nav><main><img src="{% static image_path %}" alt="{{title}}" width="1024" height="1536"></main><button class="live-open" type="button" onclick="document.getElementById('live').showModal()"><i></i> Live Fields</button><dialog id="live"><button class="close" onclick="this.closest('dialog').close()">×</button><h1>{{title}}</h1><p>Values below are connected to the corresponding database fields.</p><div id="live-grid"></div></dialog>{{live_data|json_script:'portal-live-data'}}<script>const d=JSON.parse(document.getElementById('portal-live-data').textContent),g=document.getElementById('live-grid');Object.entries(d).forEach(([k,v])=>{const e=document.createElement('article');e.innerHTML=`<small>${k.replaceAll('_',' ')}</small><b>${Array.isArray(v)?v.length:v}</b>`;g.appendChild(e)});</script></body></html>
