{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barcode Instruction Center</title><link rel="stylesheet" href="{% static 'css/barcode_control.css' %}"></head><body><header><b>EMERALD <span>ROZALIA</span> LIMITED</b><nav><a href="{% url 'barcode_master' %}">Generator</a><a href="{% url 'barcode_instruction_center' 'generation' %}" class="{% if mode == 'generation' %}on{% endif %}">Generation</a><a href="{% url 'barcode_instruction_center' 'scan' %}" class="{% if mode == 'scan' %}on{% endif %}">Scanning</a><a href="{% url 'barcode_instruction_center' 'traceability' %}" class="{% if mode == 'traceability' %}on{% endif %}">Traceability</a><a class="live" href="{% url 'barcode_scan_control' %}">LIVE SCAN</a></nav></header><main class="reference-gallery">{% for image in images %}<figure><a href="{% static 'img/barcode/'|add:image %}" target="_blank"><img src="{% static 'img/barcode/'|add:image %}" alt="{{mode}} instruction reference"></a><figcaption>Approved {{mode}} operating instruction • Open full size for workstation display or printing</figcaption></figure>{% endfor %}</main></body></html>
