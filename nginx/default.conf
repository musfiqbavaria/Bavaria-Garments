server {
  listen 80;
  server_name _;
  client_max_body_size 50M;
  location /static/ { alias /app/staticfiles/; expires 7d; }
  location /media/ { alias /app/media/; expires 7d; }
  location / { proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_pass http://web:8000; }
}
