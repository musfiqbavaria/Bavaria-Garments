# ---------------------------------------------------------------------------
# Emerald Rozalia - Project 1
#
# The HTTP server below is the working default. The HTTPS block underneath is
# commented out because no certificate is provisioned yet; enabling it is a
# two-step change documented at the bottom of this file.
#
# Do NOT set DJANGO_SECURE_SSL=1 in .env until the HTTPS block is live: Django
# would then redirect every request to https:// and, with nothing listening on
# 443, the site becomes unreachable.
# ---------------------------------------------------------------------------

# Throttle sign-in attempts at the edge as well as in Django, so a brute-force
# attempt is dropped before it costs a gunicorn worker a password hash.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 50M;

  # Do not advertise the nginx version.
  server_tokens off;

  # Security headers. Django sets its own on responses it generates; these also
  # cover static and media, which never pass through Django.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # The dashboards carry per-page inline <style> blocks and inline SVG, so
  # 'unsafe-inline' is required for style-src until that is refactored.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /static/ { alias /app/staticfiles/; expires 7d; access_log off; }

  # Media is user-uploaded and includes confidential documents, payslips, QC
  # photographs and proof of delivery. It must NOT be served directly by nginx:
  # a direct URL would bypass Django's per-file permission check and the
  # FileAccessLog audit trail entirely. All file delivery goes through
  # /files/<type>/<id>/<action>/ instead.
  location /media/ { return 404; }

  location /login/ {
    limit_req zone=login_zone burst=10 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://web:8000;
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://web:8000;
  }
}

