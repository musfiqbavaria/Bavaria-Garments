services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    # Without a healthcheck, depends_on only waits for the container to start,
    # so web raced Postgres and failed on first boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["static_data:/app/staticfiles", "media_data:/app/media"]

  worker:
    build: .
    restart: unless-stopped
    command: celery -A core worker -l INFO
    env_file: .env
    # Only web migrates and seeds. Three containers racing the same migration is
    # how a schema ends up half-applied.
    environment:
      DJANGO_AUTO_MIGRATE: "0"
      DJANGO_AUTO_SEED: "0"
    # The image healthcheck is an HTTP probe for web. A worker serves no HTTP, so
    # ask celery whether it is responding on the broker instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["media_data:/app/media"]

  beat:
    build: .
    restart: unless-stopped
    # beat writes its schedule and pidfile to the working directory by default,
    # which the unprivileged user must not need to write to. Keep both in
    # /app/run, which is a volume, so the schedule survives a restart and beat
    # does not re-fire slots it has already run.
    command: >
      celery -A core beat -l INFO
      --schedule=/app/run/celerybeat-schedule
      --pidfile=
    env_file: .env
    environment:
      DJANGO_AUTO_MIGRATE: "0"
      DJANGO_AUTO_SEED: "0"
    volumes: ["beat_data:/app/run"]
    # A scheduler exposes nothing to probe, and the image's HTTP check would mark
    # it permanently unhealthy.
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    ports: ["80:80"]
    # To serve HTTPS, add "443:443" above, mount the certificate directory
    # below, and follow the instructions at the foot of nginx/default.conf.
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      # media_data is intentionally NOT mounted. nginx returns 404 for /media/
      # so uploads cannot be fetched without passing Django's per-file
      # permission check and audit log.
      # - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  static_data:
  media_data:
  beat_data:
